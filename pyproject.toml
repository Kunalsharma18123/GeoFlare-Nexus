[project]
name = "geoflare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Phinix-Morgan", email = "chauhanshiv2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "geodatasets>=2026.5.1",
    "geopandas>=1.1.4",
    "joblib>=1.6.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "rasterio>=1.5.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
geoflare = "geoflare:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
